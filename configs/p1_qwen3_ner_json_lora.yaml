# Project 1: Qwen3-0.6B -> strict-JSON named-entity extractor
# Approach : LoRA on a 16-bit instruct model + SFT on prompt/completion pairs (loss on the answer only)
# Chapter  : course/09_project1_json_extractor.md      Runtime: ~10-15 min on a Colab T4 (estimate)
#
# Swap the model: change model.id (e.g. Qwen/Qwen3-1.7B, HuggingFaceTB/SmolLM2-360M-Instruct,
# meta-llama/Llama-3.2-1B-Instruct), or override it: python -m modeltune.train <this file> model.id=...
run_name: p1-qwen3-0.6b-ner-json-lora
method: sft

model:
  id: Qwen/Qwen3-0.6B
  quantization: none          # 0.6B params x 2 bytes = ~1.2 GB. No need to quantize.

lora:
  r: 16                       # adapter rank: capacity of the update
  alpha: 32                   # scale = alpha / r = 2
  dropout: 0.05
  target_modules: all-linear  # q,k,v,o + gate,up,down in every block

data:
  dataset: eriktks/conll2003
  revision: refs/convert/parquet   # script-based datasets no longer load; the Hub's parquet branch does
  formatter: modeltune.formatters:conll_to_ner_json   # BIO tags -> {"person": [...], ...}
  train_split: train
  eval_split: validation
  max_train_samples: 4000
  max_eval_samples: 200

train:                        # any SFTConfig / TrainingArguments field
  num_train_epochs: 1
  learning_rate: 2.0e-4       # LoRA likes ~10x the full fine-tuning LR
  lr_scheduler_type: cosine
  warmup_steps: 0.05          # a float < 1 means "fraction of total steps"
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  per_device_eval_batch_size: 16
  max_length: 512             # longest CoNLL example is ~250 tokens with the prompt
  eval_strategy: steps
  eval_steps: 50
  logging_steps: 10
  # completion_only_loss defaults to True for prompt/completion data: we never train on the prompt.

eval:
  metric: ner_json
  split: test
  max_samples: 300
  max_new_tokens: 200
  batch_size: 32
  chat_template_kwargs: {enable_thinking: false}   # Qwen3: answer directly, no <think> block

hub:
  push: true
  repo_id: 57Ajay/qwen3-0.6b-ner-json-lora
